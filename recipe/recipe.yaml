schema_version: 1

context:
  name: clusterx
  version: 2.4.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: f07b363294005793730aeb01c0dd6b3fc639ccc70e940540cb6ccd8602fc9eca

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - cell=clusterx.cli.main:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - scikit-learn
    - matplotlib-base
    - ase >=3.25.0
    - plac
    - pytest
    - spglib
    - nglview
    - ipywidgets
    - pytest-html
    - tqdm
    - pandas
    - python-dotenv
    - toml
    - numba >=0.59.0
tests:
  - python:
      imports:
        - clusterx
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - cell --help

about:
  summary: CELL (aka clusterX) is a python package for building Cluster Expansion models of simple and complex alloys and performing thermodynamical analyses of materials.
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: http://sol.physik.hu-berlin.de/cell/

extra:
  recipe-maintainers:
    - jan-janssen
